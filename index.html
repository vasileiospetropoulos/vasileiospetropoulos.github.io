<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vasileios Petropoulos | Portfolio</title>
    <meta name="description" content="The professional portfolio of Vasileios Petropoulos, covering audio engineering, music production, sound design and software development.">

    <style>
        :root {
            --background: #0b0d12;
            --surface: #131720;
            --text: #f0f2f7;
            --muted: #a2aaba;
            --accent: #76e4d5;
            --border: #272e3a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.7;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: min(1050px, 90%);
            margin: 0 auto;
        }

        header {
            padding: 25px 0;
            border-bottom: 1px solid var(--border);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo {
            font-weight: bold;
            font-size: 1.05rem;
            letter-spacing: 0.3px;
        }

        .logo span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .nav-links a:hover,
        .text-link:hover {
            color: var(--accent);
        }

        .hero {
            padding: 115px 0 105px;
            border-bottom: 1px solid var(--border);
            background: radial-gradient(
                ellipse at 80% 15%,
                #17302f 0%,
                var(--background) 55%
            );
        }

        .eyebrow {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(2.7rem, 7vw, 5rem);
            line-height: 1.1;
            letter-spacing: -2px;
            max-width: 850px;
            margin-bottom: 25px;
        }

        h1 span {
            color: var(--accent);
        }

        .intro {
            max-width: 690px;
            color: var(--muted);
            font-size: 1.1rem;
            margin-bottom: 32px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 13px;
        }

        .button {
            display: inline-block;
            padding: 12px 21px;
            border-radius: 7px;
            border: 1px solid var(--border);
            font-weight: bold;
            font-size: 0.93rem;
            transition: 0.2s;
        }

        .button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #091311;
        }

        .button:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        section {
            padding: 75px 0;
            border-bottom: 1px solid var(--border);
        }

        .section-label {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.78rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h2 {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            margin-bottom: 18px;
            line-height: 1.25;
        }

        .section-intro {
            max-width: 700px;
            color: var(--muted);
            margin-bottom: 32px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 26px;
            transition: border-color 0.2s, transform 0.2s;
        }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
        }

        .card h3 {
            font-size: 1.15rem;
            margin-bottom: 10px;
        }

        .card p {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .about-text {
            max-width: 760px;
            color: var(--muted);
        }

        .about-text p + p {
            margin-top: 16px;
        }
